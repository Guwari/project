[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsentinel-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
cloudsentinel = "cloudsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["cloudsentinel*"]
