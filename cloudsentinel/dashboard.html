<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudSentinel AI</title>
  <style>
    body {
      font-family: "Inter", system-ui, sans-serif;
      max-width: 960px;
      margin: 48px auto;
      padding: 0 24px;
      color: #18283b;
      background: #f4f7fa;
    }
    h1 { margin-bottom: 8px; }
    form, article {
      background: white;
      border: 1px solid #d8e1ea;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }
    select, button {
      font: inherit;
      padding: 10px 14px;
      margin: 8px 8px 8px 0;
    }
    button {
      background: #174d77;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    article h2 { font-size: 18px; }
    #status { min-height: 24px; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>CloudSentinel AI</h1>
    <p>Explore security findings using simulated AWS configurations.</p>

    <form id="scan-form">
      <label for="scenario">Demo scenario</label>
      <select id="scenario" name="scenario">
        <option value="exposed">Exposed resources</option>
        <option value="secure">Secure configuration</option>
        <option value="denied">Permission denied</option>
      </select>
      <button id="scan-button" type="submit">Run demo scan</button>
    </form>

    <p id="status" role="status" aria-live="polite">
      Choose a scenario and run a scan.
    </p>
    <section id="results" aria-label="Scan results"></section>
  </main>

  <script>
    const form = document.querySelector("#scan-form");
    const button = document.querySelector("#scan-button");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");

    function addCard(title, description) {
      const card = document.createElement("article");
      const heading = document.createElement("h2");
      const body = document.createElement("p");

      heading.textContent = title;
      body.textContent = description;
      card.append(heading, body);
      results.append(card);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      results.replaceChildren();
      status.textContent = "Running demo scan…";

      const scenario = document.querySelector("#scenario").value;
      const query = new URLSearchParams({ scenario });

      try {
        const response = await fetch(`/scans?${query}`, {
          method: "POST",
        });

        if (!response.ok) {
          throw new Error(`Scan request failed (HTTP ${response.status}).`);
        }

        const report = await response.json();
        status.textContent =
          `Demo scan ${report.status}. ` +
          `${report.findings.length} findings. ` +
          `${report.errors.length} coverage errors.`;

        for (const finding of report.findings) {
          addCard(
            `${finding.rule} · ${finding.severity.toUpperCase()} · ${finding.title}`,
            `${finding.resource} — ${finding.remediation}`,
          );
        }

        for (const error of report.errors) {
          addCard(
            `Coverage error · ${error.code}`,
            `${error.operation} on ${error.resource}. ` +
            "This configuration could not be assessed.",
          );
        }

        if (report.status === "complete" && report.findings.length === 0) {
          addCard(
            "No findings in this demo",
            "The simulated configuration passed the implemented checks.",
          );
        }
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
